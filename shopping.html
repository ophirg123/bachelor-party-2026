  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2C4B5D;
      --accent: #6B8E80;
      --bg: #1a1a2e;
      --surface: #F4F7F6;
      --card: #FFFFFF;
      --text: #2C4B5D;
      --muted: #647E8C;
      --danger: #e74c3c;
      --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Heebo', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--surface);
      min-height: 100vh;
    }
    .header {
      background: var(--primary);
      color: white;
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 22px; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.8; }
    .progress-bar {
      background: rgba(255,255,255,0.2);
      height: 6px;
      border-radius: 3px;
      margin-top: 12px;
      overflow: hidden;
    }
    .progress-fill {
      background: var(--accent);
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .progress-text {
      font-size: 11px;
      margin-top: 4px;
      opacity: 0.7;
    }
    .filters {
      display: flex;
      gap: 6px;
      padding: 10px 15px;
      overflow-x: auto;
      background: var(--surface);
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 76px;
      z-index: 99;
    }
    .filter-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--primary);
      background: white;
      color: var(--primary);
      font-size: 12px;
      font-family: 'Heebo', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 500;
    }
    .filter-btn.active {
      background: var(--primary);
      color: white;
    }
    .section {
      margin: 10px;
    }
    .section-header {
      background: var(--primary);
      color: white;
      padding: 10px 15px;
      border-radius: 12px 12px 0 0;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .section-header .count {
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
    }
    .section-items {
      background: white;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
      transition: all 0.2s;
    }
    .item:last-child { border-bottom: none; }
    .item.checked {
      opacity: 0.5;
      background: #f8f8f8;
    }
    .item.checked .item-name {
      text-decoration: line-through;
    }
    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
    }
    .checkbox.checked {
      background: var(--accent);
      color: white;
    }
    .item-info { flex: 1; }
    .item-name { font-size: 14px; font-weight: 500; }
    .item-qty {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .item-source {
      font-size: 10px;
      background: #e8f1f2;
      color: var(--primary);
      padding: 1px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 2px;
    }
    .budget-bar {
      background: white;
      margin: 10px;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .budget-bar h3 { font-size: 14px; margin-bottom: 8px; }
    .budget-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
    }
    .budget-row.total {
      font-weight: 700;
      border-top: 1px solid #e0e0e0;
      padding-top: 8px;
      margin-top: 4px;
      font-size: 15px;
    }
    .clear-btn {
      display: block;
      margin: 15px auto;
      padding: 10px 20px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Heebo', sans-serif;
      font-size: 13px;
      cursor: pointer;
    }
    .back-link {
      display: block;
      text-align: center;
      padding: 15px;
      color: var(--accent);
      font-size: 13px;
      text-decoration: none;
    }
    .hidden { display: none !important; }
  </style>
</head>

  ]},

const STORAGE_KEY = 'bachelor-shopping-2026';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } 
  catch { return {}; }
}
function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
let filter = 'all';

function getItemId(si, ii) { return `s${si}_i${ii}`; }

function render() {
  const container = document.getElementById('sections');
  let total = 0, checked = 0;
  let html = '';

  DATA.forEach((section, si) => {
    let sectionChecked = 0;
    let itemsHtml = '';
    
    section.items.forEach((item, ii) => {
      const id = getItemId(si, ii);
      const isChecked = !!state[id];
      total++;
      if (isChecked) { checked++; sectionChecked++; }

      const show = filter === 'all' || (filter === 'checked' && isChecked) || (filter === 'unchecked' && !isChecked);
      
      itemsHtml += `
        <div class="item ${isChecked ? 'checked' : ''} ${show ? '' : 'hidden'}" onclick="toggle('${id}')">
          <div class="checkbox ${isChecked ? 'checked' : ''}">${isChecked ? '✓' : ''}</div>
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-qty">${item.qty}</div>
          </div>
        </div>`;
    });

    const remaining = section.items.length - sectionChecked;
    const allDone = remaining === 0;
    
    html += `
      <div class="section">
        <div class="section-header" style="${allDone ? 'opacity:0.5' : ''}">
          <span>${section.section}</span>
          <span class="count">${sectionChecked}/${section.items.length}</span>
        </div>
        <div class="section-items">${itemsHtml}</div>
      </div>`;
  });

  container.innerHTML = html;

  const pct = total > 0 ? Math.round(checked / total * 100) : 0;
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${checked} / ${total} פריטים (${pct}%)`;
}

function toggle(id) {
  state[id] = !state[id];
  saveState(state);
  render();
}

function clearAll() {
  if (confirm('בטוח? זה ימחק את כל הסימונים')) {
    state = {};
    saveState(state);
    render();
  }
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});

render();
